name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prisma generate
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thermal_lead_tracker?schema=public

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test
